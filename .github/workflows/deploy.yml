name: Continuous Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Quality Gate (Restore & Build)
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore

      - name: Run Test Verification
        run: |
          dotnet test --configuration Release --no-build

      - name: Trigger Production Deployment Webhook
        if: success() && (env.DEPLOY_WEBHOOK_URL != '' || env.RENDER_DEPLOY_HOOK_URL != '')
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL || secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering automated production deployment webhook..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$DEPLOY_WEBHOOK_URL")
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Successfully triggered deployment (HTTP $HTTP_STATUS)."
          else
            echo "Failed to trigger deployment (HTTP $HTTP_STATUS): $RESPONSE"
            exit 1
          fi

      - name: Verify Production Health Endpoint
        if: success() && (env.APP_URL != '' || env.RENDER_APP_URL != '')
        env:
          APP_URL: ${{ secrets.APP_URL || secrets.RENDER_APP_URL }}
        run: |
          echo "Waiting 30 seconds for container rollout..."
          sleep 30
          HEALTH_URL="${APP_URL%/}/health"
          echo "Probing health endpoint at $HEALTH_URL..."
          curl -f --retry 10 --retry-delay 15 --retry-connrefused --max-time 10 "$HEALTH_URL"
          echo "Production deployment is verified and HEALTHY!"
